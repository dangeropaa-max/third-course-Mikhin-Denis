<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD-интерфейс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Публикации</h1>
        <p class="subtitle">JSONPlaceholder API</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2 id="form-title">Новая публикация</h2>

            <form id="post-form" novalidate>
                <label class="form-field">
                    <span>Заголовок</span>
                    <input
                        type="text"
                        id="title-input"
                        placeholder="Введите заголовок"
                        autocomplete="off">
                </label>

                <label class="form-field">
                    <span>Текст</span>
                    <textarea
                        id="body-input"
                        rows="4"
                        placeholder="Введите текст публикации"></textarea>
                </label>

                <p id="form-error" class="form-error"></p>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">
                        Сохранить
                    </button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>
                        Отмена
                    </button>
                </div>
            </form>
        </section>

        <section class="controls">
            <button id="load-btn" class="btn btn-primary">Загрузить публикации</button>

            <input
                type="search"
                id="filter-input"
                class="filter-input"
                placeholder="Поиск по заголовку или тексту..."
                disabled>
        </section>

        <section id="status" class="status"></section>

        <section id="posts-list" class="posts-list"></section>

    </main>

    <script src="app.js"></script>
</body>
</html>
