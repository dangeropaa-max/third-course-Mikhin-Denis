<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Занятие 6. Сазерленд–Ходжман</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Отсечение многоугольника: Сазерленд–Ходжман</h1>

  <div class="controls">
    <fieldset>
      <legend>Окно</legend>
      <label>xmin: <input id="xmin" type="number" value="10"></label>
      <label>ymin: <input id="ymin" type="number" value="8"></label>
      <label>xmax: <input id="xmax" type="number" value="45"></label>
      <label>ymax: <input id="ymax" type="number" value="28"></label>
    </fieldset>

    <fieldset>
      <legend>Многоугольник</legend>
      <select id="shape">
        <option value="inside">Полностью внутри</option>
        <option value="outside">Полностью снаружи</option>
        <option value="one">Пересекает одну границу</option>
        <option value="two">Пересекает две границы</option>
        <option value="all" selected>Пересекает все четыре</option>
        <option value="concave">Невыпуклый</option>
        <option value="vertexOnEdge">Вершина на границе</option>
        <option value="edgeOnEdge">Ребро вдоль границы</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>Этап</legend>
      <select id="stage">
        <option value="original">Исходный</option>
        <option value="left">После LEFT</option>
        <option value="right">После RIGHT</option>
        <option value="top">После TOP</option>
        <option value="bottom" selected>После BOTTOM (итог)</option>
      </select>
      <button id="build">Построить</button>
    </fieldset>
  </div>

  <canvas id="canvas" width="600" height="400"></canvas>

  <div class="panels">
    <div>
      <h2>Промежуточные результаты</h2>
      <table id="stagesTable">
        <thead>
          <tr>
            <th>Этап</th><th>Вершин</th><th>Координаты</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
